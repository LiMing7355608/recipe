<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fa-solid fa-utensils"></i>Recipe Finder</h1>
            <p>Find delicious recipe from around the world</p>
        </header>

        <p class="api-link">Data from <a href="https://www.themealdb.com/api.php">TheMealDB</a></p>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for meals or keywords">
            <button id="search-btn">Search</button>
        </div>

        <div id="error-container" class="hidden"></div>
        <div id="result-heading" class="result-heading hidden"></div>
        <div id="meals" class="meals-container hidden"></div>

        <div id="meal-details" class="hidden">
            <button id="back-btn"><i class="fa-solid fa-arrow-left"></i>Back to recipes</button>
            <div class="meal-details-content"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
